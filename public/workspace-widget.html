/* Shared responsive prompt editor for MCP Apps hosts. */
main{max-width:1020px;width:100%;padding:clamp(8px,2vw,18px)}
.shell{padding:clamp(12px,2.8vw,26px);width:100%;min-width:0}
.fields{gap:18px}.field{min-width:0}
.field label{font-size:13px;font-weight:720;line-height:1.5;margin:0 0 8px;color:#e7ddf7}
.field textarea{display:block;min-height:210px;max-height:75vh;width:100%;resize:vertical;border-radius:14px;padding:16px;font-size:15px;line-height:1.65;overflow-y:auto;scrollbar-gutter:stable}
.field textarea:focus-visible,.search input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px;border-color:#a78bfa}
.field.expanded textarea{min-height:min(65vh,560px);max-height:85vh}
.field-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:8px}
.field-count{color:#b8adc9;font-size:12px;font-variant-numeric:tabular-nums}
.field-controls button{min-height:42px;padding:10px 14px}.field.expanded .field-controls button{background:#473467}
.search input{min-height:46px;min-width:0;font-size:14px}.toolbar button{min-height:44px}
.prompt{font-size:14px;line-height:1.65;max-height:65vh;overflow:auto}
@media(max-width:560px){.shell{border-radius:14px}.field textarea{min-height:180px;padding:14px;font-size:16px}.field.expanded textarea{min-height:55vh}.field-controls{justify-content:space-between}.search{flex-wrap:wrap}.search input{flex:1 1 100%}.search button{flex:1}.toolbar button{flex:1 1 auto}}

function detectCode(){const raw=(navigator.language||'en').toUpperCase().replace('-','_');return LANGUAGES.some(x=>x.code===raw)?raw:(LANGUAGES.some(x=>x.code===raw.split('_')[0])?raw.split('_')[0]:'EN')}
const state={uiLanguage:detectCode(),inputLanguage:detectCode(),outputLanguage:detectCode()};if(window.openai?.theme==='light')document.documentElement.style.colorScheme='light dark';
const tr=(k,fallback)=>LOCALES[state.uiLanguage]?.[k]||LOCALES.EN?.[k]||fallback||k;
const options=(selected)=>LANGUAGES.map(l=>`<option value="${l.code}" ${l.code===selected?'selected':''}>${l.flag} ${esc(l.name)}</option>`).join('');
function renderLanguageBar(){document.documentElement.lang=state.uiLanguage.toLowerCase().replace('_','-');document.documentElement.dir=['AR','HE'].includes(state.uiLanguage)?'rtl':'ltr';globalLangs.innerHTML=`<label>🌍 UI language<select id="uiLang">${options(state.uiLanguage)}</select></label><label>⌨️ Input language<select id="inputLang">${options(state.inputLanguage)}</select></label><label>🤖 ${esc(tr('aiOutputLang','AI Output Language'))}<select id="outputLang">${options(state.outputLanguage)}</select></label>`;const expandLabel=WORKSPACE_EXPAND[state.uiLanguage]||WORKSPACE_EXPAND.EN;const expandButton=document.querySelector('#expandWorkspace');expandButton.title=expandLabel;expandButton.setAttribute('aria-label',expandLabel);globalLangs.querySelector('#uiLang').onchange=async e=>{state.uiLanguage=e.target.value;renderLanguageBar();await callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})};globalLangs.querySelector('#inputLang').onchange=e=>state.inputLanguage=e.target.value;globalLangs.querySelector('#outputLang').onchange=e=>state.outputLanguage=e.target.value}
renderLanguageBar();
const request=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')});const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(typeof m.id==='number'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')renderResult(m.params)});
// ChatGPT exposes window.openai; other MCP Apps-compatible hosts use the
// portable JSON-RPC bridge. Supporting both keeps the GUI usable in ChatGPT
// without making the MCP server client-specific.
const hasOpenAIHost=()=>Boolean(window.openai&&typeof window.openai.callTool==='function');
let hostContext=null;const ready=(async()=>{if(hasOpenAIHost())return;const initialized=await request('ui/initialize',{appInfo:{name:'polyglot-workspace',version:'1.11.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});hostContext=initialized?.hostContext||null;notify('ui/notifications/initialized',{})})();

// MCP Apps hosts start with a short iframe. Report the actual rendered height
// after initialization, after every view update, and whenever content grows.
// The host controls any final height cap; this widget never changes permissions.
let resizeQueued=false,lastReportedHeight=0;
function measureWorkspaceHeight(){
 const root=document.documentElement,previousHeight=root.style.height;
 root.style.height='max-content';
 const height=Math.ceil(root.getBoundingClientRect().height);
 root.style.height=previousHeight;
 return height;
}
function notifyWorkspaceHeight(){
 if(hasOpenAIHost()||resizeQueued)return;
 resizeQueued=true;
 requestAnimationFrame(()=>{
  resizeQueued=false;
  const height=measureWorkspaceHeight();
  if(height>0&&height!==lastReportedHeight){
   lastReportedHeight=height;
   notify('ui/notifications/size-changed',{height});
  }
 });
}
function enableWorkspaceAutoResize(){
 if(hasOpenAIHost())return; // ChatGPT's native widget host handles its own sizing.
 if(typeof ResizeObserver==='function'){
  const observer=new ResizeObserver(notifyWorkspaceHeight);
  observer.observe(document.documentElement);
  observer.observe(document.body);
 }
 window.addEventListener('resize',notifyWorkspaceHeight);
 notifyWorkspaceHeight();
}
async function callTool(name,args){await ready;const result=hasOpenAIHost()?await window.openai.callTool(name,args):await request('tools/call',{name,arguments:args});renderResult(result);return result}
async function sendPromptToHost(text){if(window.openai&&typeof window.openai.sendFollowUpMessage==='function'){return window.openai.sendFollowUpMessage({prompt:text})}return request('ui/message',{role:'user',content:[{type:'text',text}]})}
function syncLocalization(d){const l=d?.localization;if(!l)return;state.uiLanguage=l.uiLanguage?.code||state.uiLanguage;if(['languages','prompt','compare'].includes(d.view)){if(l.inputLanguage?.code)state.inputLanguage=l.inputLanguage.code;if(l.outputLanguage?.code)state.outputLanguage=l.outputLanguage.code}renderLanguageBar()}
function entLabel(e){if(!e)return'';if(e.state==='pro_monthly')return'Pro Monthly';if(e.state==='pro_annual')return'Pro Annual';if(e.state==='trial')return'Free Trial';if(e.state==='expired')return tr('trialExpired','Trial Expired');return'Trial Not Started'}function renderEnt(e){if(!e)return;lastEnt=e;const p=e.pricing;entEl.innerHTML=`<div class="ent"><div><span class="pill">${esc(entLabel(e))}</span><div class="status">${e.isPro?'All 1,000+ templates unlocked':e.state==='expired'?(e.dailyFreeRemaining>0?'1 free send available · Pro features locked':'Free send used · resets 24h after last send'):'3-day trial · all features unlocked'}</div></div><span class="price">$${p.monthly.price.toFixed(2)}/month<br>$${p.annual.price.toFixed(2)}/year · ${esc(p.annual.savingsLabel)}</span></div>`}
function searchView(d){syncLocalization(d);renderEnt(d.entitlement);lastSearch=d.query||'';app.innerHTML=`<form class="search" id="search"><input id="q" value="${esc(lastSearch)}" placeholder="${esc(tr('search','Search templates…'))}"><button>${esc(tr('search','Search'))}</button></form><div class="grid">${d.results.map((t,i)=>`<article class="card ${t.locked?'locked':''}" data-i="${i}">${t.locked?'<span class="lock">🔒 PRO</span>':''}<h3>${esc(t.name)}</h3><p>${esc(t.description)}</p><div class="meta">${esc(t.goal)} · ${esc(t.plan)}</div></article>`).join('')}</div>${d.results.length?'':'<div class="empty">No matching templates.</div>'}`;app.querySelector('#search').onsubmit=async e=>{e.preventDefault();await callTool('search_templates',{query:app.querySelector('#q').value,limit:12,uiLanguage:state.uiLanguage})};app.querySelectorAll('.card').forEach(el=>el.onclick=()=>callTool('get_template',{name:d.results[+el.dataset.i].id,uiLanguage:state.uiLanguage}))}

function savedField(templateId,key,defaultValue){const draft=drafts.get(templateId);return draft&&Object.prototype.hasOwnProperty.call(draft,key)?draft[key]:String(defaultValue??'')}
function renderField(t,f,index){
 const value=savedField(t.id,f.key,f.defaultValue),id='pg-editor-'+index;
 return '<div class="field"><label for="'+id+'">'+esc(f.label||f.key.replaceAll('_',' '))+'</label><textarea id="'+id+'" data-key="'+esc(f.key)+'" rows="8" dir="auto" spellcheck="true" aria-keyshortcuts="Control+Enter Meta+Enter">'+esc(value)+'</textarea><div class="field-controls"><span class="field-count" aria-live="off">'+value.length.toLocaleString()+'</span><button class="secondary editor-toggle" type="button" aria-controls="'+id+'" aria-expanded="false">'+esc(editorText(0))+'</button></div></div>';
}
function fitEditor(el){
 const expanded=el.closest('.field')?.classList.contains('expanded');
 const min=expanded?320:window.innerWidth<=560?180:210;
 const max=Math.max(min,Math.min((window.innerHeight||850)*0.78,720));
 el.style.height='auto';el.style.height=Math.min(Math.max(el.scrollHeight,min),max)+'px';
}
async function requestWorkspaceFullscreen(){
 try{if(window.openai&&typeof window.openai.requestDisplayMode==='function')await window.openai.requestDisplayMode({mode:'fullscreen'});
 else if(!hasOpenAIHost()&&hostContext?.availableDisplayModes?.includes('fullscreen'))await request('ui/request-display-mode',{mode:'fullscreen'});}
 catch(_){ /* The editor remains expandable when the host declines fullscreen. */ }
}
document.querySelector('#expandWorkspace').addEventListener('click',()=>{void requestWorkspaceFullscreen();});
function enhanceEditors(t){
 app.querySelectorAll('.field textarea[data-key]').forEach(el=>{
  const field=el.closest('.field'),button=field.querySelector('.editor-toggle'),counter=field.querySelector('.field-count');
  const store=()=>{let values=drafts.get(t.id);if(!values){values={};drafts.set(t.id,values);}values[el.dataset.key]=el.value;counter.textContent=el.value.length.toLocaleString();};
  el.addEventListener('input',()=>{store();fitEditor(el);});
  el.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter'&&!event.isComposing){event.preventDefault();app.querySelector('#build')?.click();}});
  button.addEventListener('click',()=>{const expanded=field.classList.toggle('expanded');button.textContent=editorText(expanded?1:0);button.setAttribute('aria-expanded',String(expanded));if(expanded)void requestWorkspaceFullscreen();fitEditor(el);el.focus({preventScroll:true});});
  fitEditor(el);
 });
}
window.addEventListener('resize',()=>{app.querySelectorAll('.field textarea[data-key]').forEach(fitEditor)});

function templateView(d){syncLocalization(d);renderEnt(d.entitlement);const t=d.template;current=t;app.innerHTML=`<button class="secondary" id="back">← ${esc(tr('templates','Templates'))}</button><h2>${esc(t.name)}</h2><div class="desc">${esc(t.description)}</div><div class="fields">${t.fields.map((f,i)=>renderField(t,f,i)).join('')}</div><div class="toolbar"><button id="build">${esc(tr('send','Build prompt'))}</button><button class="secondary" id="compare">${esc(tr('compareMode','🔀 Compare Mode'))}</button></div><div id="providerBox" style="display:none"><div class="providers">${['chatgpt','claude','gemini','perplexity','grok','copilot','mistral','huggingchat','duckduckgo'].map((x,i)=>`<label class="provider"><input type="checkbox" value="${x}" ${i<2?'checked':''}>${x}</label>`).join('')}</div><button id="runCompare">${esc(tr('compareSendTo','Prepare comparison'))}</button></div>`;enhanceEditors(t);app.querySelector('#back').onclick=()=>callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage});const vals=()=>{const v={};app.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=x.value);return v};app.querySelector('#build').onclick=()=>callTool('build_prompt',{name:t.id,values:vals(),uiLanguage:state.uiLanguage,inputLanguage:state.inputLanguage,outputLanguage:state.outputLanguage});app.querySelector('#compare').onclick=()=>app.querySelector('#providerBox').style.display='block';app.querySelector('#runCompare').onclick=()=>{const providers=[...app.querySelectorAll('.provider input:checked')].map(x=>x.value);if(providers.length<2)return alert('Select at least two AI providers.');callTool('prepare_compare',{name:t.id,values:vals(),providers,uiLanguage:state.uiLanguage,inputLanguage:state.inputLanguage,outputLanguage:state.outputLanguage})}}
function lockedView(d){syncLocalization(d);renderEnt(d.entitlement);const p=d.entitlement.pricing;app.innerHTML=`<button class="secondary" id="back">← ${esc(tr('templates','Templates'))}</button><div class="paywall"><h2>🔒 ${esc(d.template?.name||'Poly-Glot Pro')}</h2><p>${esc(d.message||'Pro required.')}</p><div class="plans"><div>$${p.monthly.price.toFixed(2)} / month</div><div>$${p.annual.price.toFixed(2)} / year</div></div></div>`;app.querySelector('#back').onclick=()=>callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})}
function promptView(d){syncLocalization(d);renderEnt(d.entitlement);app.innerHTML=`<button class="secondary" id="edit">← Edit</button><h2>${esc(d.name)}</h2><div class="status">Input: ${esc(d.inputLanguage||'')} · Output: ${esc(d.outputLanguage||'')}</div><div class="prompt" id="prompt">${esc(d.prompt)}</div><div class="toolbar"><button id="copy">${esc(tr('copy','Copy'))}</button><button class="secondary" id="use">${esc(editorText(2))}</button></div><div class="status" id="status"></div>`;app.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(d.prompt);app.querySelector('#status').textContent=tr('promptCopied','Copied')}catch{}};app.querySelector('#use').onclick=async()=>{try{await sendPromptToHost(d.prompt)}catch{}};app.querySelector('#edit').onclick=()=>current?callTool('get_template',{name:current.id,uiLanguage:state.uiLanguage}):callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})}
function compareView(d){syncLocalization(d);renderEnt(d.entitlement);app.innerHTML=`<button class="secondary" id="back">← Edit</button><h2>${esc(tr('compareMode','🔀 Compare Mode'))}</h2><div class="desc">${esc(d.instructions||'Use the same prompt with each AI and compare results.')}</div><div class="providers">${(d.providers||[]).map(p=>`<div class="provider"><strong>${esc(p.label)}</strong><div class="status">${esc(p.url)}</div></div>`).join('')}</div><div class="prompt">${esc(d.prompt)}</div><div class="toolbar"><button id="copy">${esc(tr('copy','Copy'))}</button></div>`;app.querySelector('#copy').onclick=()=>navigator.clipboard?.writeText(d.prompt);app.querySelector('#back').onclick=()=>current?callTool('get_template',{name:current.id,uiLanguage:state.uiLanguage}):callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})}
function renderResult(r){const d=r?.structuredContent??r;if(!d)return;if(d.view==='search')searchView(d);else if(d.view==='template')templateView(d);else if(d.view==='prompt')promptView(d);else if(d.view==='compare')compareView(d);else if(d.view==='locked'||d.view==='compare_locked')lockedView(d);else if(d.view==='subscription')renderEnt(d.entitlement);else if(d.view==='languages')syncLocalization(d);notifyWorkspaceHeight()}
ready.then(async()=>{enableWorkspaceAutoResize();await callTool('get_language_options',{uiLanguage:state.uiLanguage});await callTool('open_workspace',{query:'',uiLanguage:state.uiLanguage})}).catch(()=>app.innerHTML='<div class="empty">This component needs an MCP Apps-compatible host.</div>');
</script></body></html>
