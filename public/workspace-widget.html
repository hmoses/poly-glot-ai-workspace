// without making the MCP server client-specific.
const hasOpenAIHost=()=>Boolean(window.openai&&typeof window.openai.callTool==='function');
const ready=(async()=>{if(hasOpenAIHost())return;await request('ui/initialize',{appInfo:{name:'polyglot-workspace',version:'1.5.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{})})();
async function callTool(name,args){await ready;const result=hasOpenAIHost()?await window.openai.callTool(name,args):await request('tools/call',{name,arguments:args});renderResult(result);return result}
async function sendPromptToHost(text){if(window.openai&&typeof window.openai.sendFollowUpMessage==='function'){return window.openai.sendFollowUpMessage({prompt:text})}return request('ui/message',{role:'user',content:[{type:'text',text}]})}
function syncLocalization(d){const l=d?.localization;if(!l)return;state.uiLanguage=l.uiLanguage?.code||state.uiLanguage;if(['languages','prompt','compare'].includes(d.view)){if(l.inputLanguage?.code)state.inputLanguage=l.inputLanguage.code;if(l.outputLanguage?.code)state.outputLanguage=l.outputLanguage.code}renderLanguageBar()}
function entLabel(e){if(!e)return'';if(e.state==='pro_monthly')return'Pro Monthly';if(e.state==='pro_annual')return'Pro Annual';if(e.state==='trial')return'Free Trial';if(e.state==='expired')return tr('trialExpired','Trial Expired');return'Trial Not Started'}function renderEnt(e){if(!e)return;lastEnt=e;const p=e.pricing;entEl.innerHTML=`<div class="ent"><div><span class="pill">${esc(entLabel(e))}</span><div class="status">${e.isPro?'All 1,000+ templates unlocked':e.state==='expired'?'Pro required':'25 free templates · 3-day trial'}</div></div><span class="price">$${p.monthly.price.toFixed(2)}/month<br>$${p.annual.price.toFixed(2)}/year · ${esc(p.annual.savingsLabel)}</span></div>`}
function searchView(d){syncLocalization(d);renderEnt(d.entitlement);lastSearch=d.query||'';app.innerHTML=`<form class="search" id="search"><input id="q" value="${esc(lastSearch)}" placeholder="${esc(tr('search','Search templates…'))}"><button>${esc(tr('search','Search'))}</button></form><div class="grid">${d.results.map((t,i)=>`<article class="card ${t.locked?'locked':''}" data-i="${i}">${t.locked?'<span class="lock">🔒 PRO</span>':''}<h3>${esc(t.name)}</h3><p>${esc(t.description)}</p><div class="meta">${esc(t.goal)} · ${esc(t.plan)}</div></article>`).join('')}</div>${d.results.length?'':'<div class="empty">No matching templates.</div>'}`;app.querySelector('#search').onsubmit=async e=>{e.preventDefault();await callTool('search_templates',{query:app.querySelector('#q').value,limit:12,uiLanguage:state.uiLanguage})};app.querySelectorAll('.card').forEach(el=>el.onclick=()=>callTool('get_template',{name:d.results[+el.dataset.i].id,uiLanguage:state.uiLanguage}))}
function templateView(d){syncLocalization(d);renderEnt(d.entitlement);const t=d.template;current=t;app.innerHTML=`<button class="secondary" id="back">← ${esc(tr('templates','Templates'))}</button><h2>${esc(t.name)}</h2><div class="desc">${esc(t.description)}</div><div class="fields">${t.fields.map(f=>`<div class="field"><label>${esc(f.label||f.key.replaceAll('_',' '))}</label><textarea data-key="${esc(f.key)}">${esc(f.defaultValue)}</textarea></div>`).join('')}</div><div class="toolbar"><button id="build">${esc(tr('send','Build prompt'))}</button><button class="secondary" id="compare">${esc(tr('compareMode','🔀 Compare Mode'))}</button></div><div id="providerBox" style="display:none"><div class="providers">${['chatgpt','claude','gemini','perplexity','grok','copilot','mistral'].map((x,i)=>`<label class="provider"><input type="checkbox" value="${x}" ${i<2?'checked':''}>${x}</label>`).join('')}</div><button id="runCompare">${esc(tr('compareSendTo','Prepare comparison'))}</button></div>`;app.querySelector('#back').onclick=()=>callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage});const vals=()=>{const v={};app.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=x.value);return v};app.querySelector('#build').onclick=()=>callTool('build_prompt',{name:t.id,values:vals(),uiLanguage:state.uiLanguage,inputLanguage:state.inputLanguage,outputLanguage:state.outputLanguage});app.querySelector('#compare').onclick=()=>app.querySelector('#providerBox').style.display='block';app.querySelector('#runCompare').onclick=()=>{const providers=[...app.querySelectorAll('.provider input:checked')].map(x=>x.value);if(providers.length<2)return alert('Select at least two AI providers.');callTool('prepare_compare',{name:t.id,values:vals(),providers,uiLanguage:state.uiLanguage,inputLanguage:state.inputLanguage,outputLanguage:state.outputLanguage})}}
function lockedView(d){syncLocalization(d);renderEnt(d.entitlement);const p=d.entitlement.pricing;app.innerHTML=`<button class="secondary" id="back">← ${esc(tr('templates','Templates'))}</button><div class="paywall"><h2>🔒 ${esc(d.template?.name||'Poly-Glot Pro')}</h2><p>${esc(d.message||'Pro required.')}</p><div class="plans"><div>$${p.monthly.price.toFixed(2)} / month</div><div>$${p.annual.price.toFixed(2)} / year</div></div></div>`;app.querySelector('#back').onclick=()=>callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})}
function promptView(d){syncLocalization(d);renderEnt(d.entitlement);app.innerHTML=`<button class="secondary" id="edit">← Edit</button><h2>${esc(d.name)}</h2><div class="status">Input: ${esc(d.inputLanguage||'')} · Output: ${esc(d.outputLanguage||'')}</div><div class="prompt" id="prompt">${esc(d.prompt)}</div><div class="toolbar"><button id="copy">${esc(tr('copy','Copy'))}</button><button class="secondary" id="use">Use in ChatGPT</button></div><div class="status" id="status"></div>`;app.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(d.prompt);app.querySelector('#status').textContent=tr('promptCopied','Copied')}catch{}};app.querySelector('#use').onclick=async()=>{try{await sendPromptToHost(d.prompt)}catch{}};app.querySelector('#edit').onclick=()=>current?callTool('get_template',{name:current.id,uiLanguage:state.uiLanguage}):callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})}
function compareView(d){syncLocalization(d);renderEnt(d.entitlement);app.innerHTML=`<button class="secondary" id="back">← Edit</button><h2>${esc(tr('compareMode','🔀 Compare Mode'))}</h2><div class="desc">${esc(d.instructions||'Use the same prompt with each AI and compare results.')}</div><div class="providers">${(d.providers||[]).map(p=>`<div class="provider"><strong>${esc(p.label)}</strong><div class="status">${esc(p.url)}</div></div>`).join('')}</div><div class="prompt">${esc(d.prompt)}</div><div class="toolbar"><button id="copy">${esc(tr('copy','Copy'))}</button></div>`;app.querySelector('#copy').onclick=()=>navigator.clipboard?.writeText(d.prompt);app.querySelector('#back').onclick=()=>current?callTool('get_template',{name:current.id,uiLanguage:state.uiLanguage}):callTool('search_templates',{query:lastSearch,limit:12,uiLanguage:state.uiLanguage})}
function renderResult(r){const d=r?.structuredContent??r;if(!d)return;if(d.view==='search')searchView(d);else if(d.view==='template')templateView(d);else if(d.view==='prompt')promptView(d);else if(d.view==='compare')compareView(d);else if(d.view==='locked'||d.view==='compare_locked')lockedView(d);else if(d.view==='subscription')renderEnt(d.entitlement);else if(d.view==='languages')syncLocalization(d)}
ready.then(async()=>{await callTool('get_language_options',{uiLanguage:state.uiLanguage});await callTool('open_workspace',{query:'',uiLanguage:state.uiLanguage})}).catch(()=>app.innerHTML='<div class="empty">This component needs an MCP Apps-compatible host.</div>');
</script></body></html>
